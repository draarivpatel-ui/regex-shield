name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run the test suite
        run: npm test

      - name: Verify the CommonJS artifact
        run: node scripts/build-cjs.mjs --check

      - name: CLI smoke test for a safe pattern
        run: node bin/regex-shield.mjs '^[a-z]+$'

      - name: CLI smoke test for an unsafe pattern
        run: |
          set +e
          node bin/regex-shield.mjs '(a+)+$'
          status=$?
          set -e
          test "$status" -eq 1

      - name: Benchmark smoke test
        run: node benchmarks/bench.mjs --iterations 25
